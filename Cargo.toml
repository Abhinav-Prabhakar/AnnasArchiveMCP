[package]
name = "annas-archive-mcp"
version = "1.0.4"
edition = "2021"
description = "A robust Rust MCP server for searching and downloading books from Anna's Archive over MCP."
license = "MIT"
readme = "README.md"
repository = "https://github.com/your-org/annas-archive-mcp"
homepage = "https://github.com/your-org/annas-archive-mcp"
documentation = "https://github.com/your-org/annas-archive-mcp#readme"
authors = ["Abhinav"]
keywords = ["mcp", "books", "downloader", "rust", "stdio", "annas-archive"]
categories = ["command-line-utilities", "network-programming"]

[lib]
name = "annas_archive_mcp"
path = "src/lib.rs"

[[bin]]
name = "annas-archive-mcp"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
bytes = "1"
directories = "5"
dotenvy = "0.15"
futures-core = "0.3"
futures-util = "0.3"
infer = "0.16"
opener = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
httpmock = "0.7"
pretty_assertions = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
